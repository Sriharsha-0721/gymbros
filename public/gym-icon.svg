    <path d="M 260 230 C 275 225, 290 235, 292 248" fill="none" stroke="#0f172a" stroke-width="5" stroke-linecap="round" />
    <path d="M 267 292 C 247 302, 230 292, 227 277" fill="none" stroke="#0f172a" stroke-width="5" stroke-linecap="round" />
