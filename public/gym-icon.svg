<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#181a20" />
      <stop offset="70%" stop-color="#0c0d11" />
      <stop offset="100%" stop-color="#050608" />
    </radialGradient>
    <linearGradient id="limeGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d4ff00" />
      <stop offset="100%" stop-color="#99e600" />
    </linearGradient>
    <linearGradient id="armWhite" x1="20%" y1="0%" x2="80%" y2="100%">
